<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#006AFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#29B2FE;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="url(#grad)"/>
  
  <!-- Letter A with bolt icon -->
  <g transform="translate(50, 50)">
    <!-- Bolt/Zap icon -->
    <path d="M -15 -20 L 5 -5 L -5 5 L 15 20 L -5 10 L 5 0 Z" fill="white" opacity="0.9"/>
    <!-- Letter A -->
    <text x="0" y="25" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle" opacity="0.95">A</text>
  </g>
</svg>
